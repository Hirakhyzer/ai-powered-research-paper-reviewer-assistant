<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Reviewer workflow">
  <rect width="1000" height="280" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#111827">Transparent Reviewer-Support Workflow</text>
  <g font-family="Arial" font-size="14" fill="#111827">
    <circle cx="100" cy="135" r="48" fill="#dbeafe" stroke="#1d4ed8"/><text x="100" y="132" text-anchor="middle">Generate</text><text x="100" y="150" text-anchor="middle">synthetic corpus</text>
    <circle cx="280" cy="135" r="48" fill="#dcfce7" stroke="#15803d"/><text x="280" y="132" text-anchor="middle">Summarize</text><text x="280" y="150" text-anchor="middle">paper</text>
    <circle cx="460" cy="135" r="48" fill="#fef3c7" stroke="#b45309"/><text x="460" y="132" text-anchor="middle">Audit</text><text x="460" y="150" text-anchor="middle">methods</text>
    <circle cx="640" cy="135" r="48" fill="#ede9fe" stroke="#7c3aed"/><text x="640" y="132" text-anchor="middle">Compare</text><text x="640" y="150" text-anchor="middle">citations</text>
    <circle cx="820" cy="135" r="48" fill="#fee2e2" stroke="#dc2626"/><text x="820" y="132" text-anchor="middle">Checklist</text><text x="820" y="150" text-anchor="middle">for humans</text>
  </g>
  <g stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M148 135 L232 135"/><path d="M328 135 L412 135"/><path d="M508 135 L592 135"/><path d="M688 135 L772 135"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <text x="500" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#4b5563">No automatic acceptance, rejection, plagiarism judgment, or misconduct finding.</text>
</svg>
