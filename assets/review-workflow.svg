<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-label="Reviewer assistant workflow">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#475569"/></marker>
  </defs>
  <rect width="1400" height="520" rx="30" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="32" font-weight="800" fill="#0f172a">Transparent reviewer-support workflow</text>
  <text x="700" y="90" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#475569">From synthetic manuscripts to human-review prompts, reports, and audit trails</text>
  <g font-family="Inter,Segoe UI,Arial" font-size="15" fill="#0f172a" filter="url(#shadow)">
    <g transform="translate(70 168)"><rect width="174" height="112" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="87" y="45" text-anchor="middle" font-weight="800">Synthetic</text><text x="87" y="69" text-anchor="middle">paper corpus</text></g>
    <g transform="translate(292 168)"><rect width="174" height="112" rx="22" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/><text x="87" y="45" text-anchor="middle" font-weight="800">Section</text><text x="87" y="69" text-anchor="middle">parsing</text></g>
    <g transform="translate(514 112)"><rect width="190" height="100" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="95" y="42" text-anchor="middle" font-weight="800">Summary &</text><text x="95" y="66" text-anchor="middle">claims</text></g>
    <g transform="translate(514 254)"><rect width="190" height="100" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="95" y="42" text-anchor="middle" font-weight="800">Methodology</text><text x="95" y="66" text-anchor="middle">risk audit</text></g>
    <g transform="translate(760 112)"><rect width="190" height="100" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="95" y="42" text-anchor="middle" font-weight="800">Citation</text><text x="95" y="66" text-anchor="middle">coverage</text></g>
    <g transform="translate(760 254)"><rect width="190" height="100" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="95" y="42" text-anchor="middle" font-weight="800">Reproducibility</text><text x="95" y="66" text-anchor="middle">checklist</text></g>
    <g transform="translate(1012 168)"><rect width="190" height="112" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="95" y="44" text-anchor="middle" font-weight="800">Human reviewer</text><text x="95" y="68" text-anchor="middle">prompts</text></g>
    <g transform="translate(1240 168)"><rect width="110" height="112" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="55" y="44" text-anchor="middle" font-weight="800">Report</text><text x="55" y="68" text-anchor="middle">+ ledger</text></g>
  </g>
  <g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M244 224H292"/><path d="M466 224C500 224 490 162 514 162"/><path d="M466 224C500 224 490 304 514 304"/>
    <path d="M704 162H760"/><path d="M704 304H760"/><path d="M950 162C982 162 974 224 1012 224"/><path d="M950 304C982 304 974 224 1012 224"/><path d="M1202 224H1240"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial" font-size="14" fill="#475569">
    <text x="700" y="438" text-anchor="middle">Every output remains a review-support signal. Human experts retain final scholarly judgment.</text>
  </g>
</svg>
