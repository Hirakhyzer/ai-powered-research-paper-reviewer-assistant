<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-label="Research paper reviewer assistant architecture">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#172554"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#eff6ff"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#020617" flood-opacity="0.26"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#cbd5e1"/></marker>
  </defs>
  <rect width="1400" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="180" cy="92" r="160" fill="#22d3ee" opacity="0.13"/>
  <circle cx="1190" cy="520" r="220" fill="#a78bfa" opacity="0.15"/>
  <text x="700" y="60" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="800" fill="#ffffff">Reviewer Assistant System Architecture</text>
  <text x="700" y="92" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="16" fill="#c7d2fe">Transparent modules for summary, critique, reproducibility, reporting, and auditability</text>
  <g font-family="Inter,Segoe UI,Arial" filter="url(#shadow)">
    <g transform="translate(72 190)"><rect width="210" height="130" rx="24" fill="url(#card)"/><text x="105" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Synthetic corpus</text><text x="105" y="78" text-anchor="middle" font-size="14" fill="#475569">papers • claims</text><text x="105" y="102" text-anchor="middle" font-size="14" fill="#475569">methods • citations</text></g>
    <g transform="translate(344 190)"><rect width="210" height="130" rx="24" fill="url(#card)"/><text x="105" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Parsing layer</text><text x="105" y="78" text-anchor="middle" font-size="14" fill="#475569">sections • metadata</text><text x="105" y="102" text-anchor="middle" font-size="14" fill="#475569">summary inputs</text></g>
    <g transform="translate(626 130)"><rect width="220" height="116" rx="24" fill="#ede9fe"/><text x="110" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#312e81">Summary engine</text><text x="110" y="76" text-anchor="middle" font-size="14" fill="#5b21b6">contributions • RQs</text></g>
    <g transform="translate(626 300)"><rect width="220" height="116" rx="24" fill="#fee2e2"/><text x="110" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#7f1d1d">Critique engines</text><text x="110" y="76" text-anchor="middle" font-size="14" fill="#b91c1c">methods • citations</text></g>
    <g transform="translate(920 130)"><rect width="210" height="116" rx="24" fill="#dcfce7"/><text x="105" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#14532d">Checklist layer</text><text x="105" y="76" text-anchor="middle" font-size="14" fill="#166534">reproducibility</text></g>
    <g transform="translate(920 300)"><rect width="210" height="116" rx="24" fill="#cffafe"/><text x="105" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#164e63">Scoring layer</text><text x="105" y="76" text-anchor="middle" font-size="14" fill="#0e7490">non-decisive signals</text></g>
    <g transform="translate(1190 190)"><rect width="150" height="130" rx="24" fill="#fef3c7"/><text x="75" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#78350f">Outputs</text><text x="75" y="76" text-anchor="middle" font-size="14" fill="#92400e">reports</text><text x="75" y="100" text-anchor="middle" font-size="14" fill="#92400e">audit ledger</text></g>
  </g>
  <g stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M282 255H344"/><path d="M554 255C594 255 586 188 626 188"/><path d="M554 255C594 255 586 358 626 358"/>
    <path d="M846 188H920"/><path d="M846 358H920"/><path d="M1130 188C1160 188 1150 255 1190 255"/><path d="M1130 358C1160 358 1150 255 1190 255"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial" fill="#c7d2fe" font-size="15">
    <text x="700" y="512" text-anchor="middle">Design boundary: the system surfaces reviewer-support evidence; acceptance, rejection, and scholarly judgment remain human responsibilities.</text>
  </g>
</svg>
