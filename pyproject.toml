[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-research-paper-reviewer-assistant"
version = "0.1.0"
description = "Independent synthetic research-paper reviewer support assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hirakhyzer" }]
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
